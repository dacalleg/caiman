loopback_users.guest = false
listeners.tcp.default = 5672
default_pass = rabbitmq
default_user = rabbitmq
default_vhost = /
hipe_compile = false
management.listener.port = 15672
management.listener.ssl = false
stomp.listeners.tcp.1 = 127.0.0.1:61613
auth_backends.1 = http
auth_http.http_method   = post
auth_http.user_path     = http://caiman_rabbitmq_auth/user
auth_http.vhost_path    = http://caiman_rabbitmq_auth/vhost
auth_http.resource_path = http://caiman_rabbitmq_auth/resource
auth_http.topic_path    = http://caiman_rabbitmq_auth/topic
deprecated_features.permit.management_metrics_collection = true