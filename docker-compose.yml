  caiman_reverse_proxy:
    restart: always
    build: ./reverse_proxy
    image: caiman_reverse_proxy:latest
    container_name: caiman_reverse_proxy
    volumes:
      - ./volumes/uploads:/data/uploads
    depends_on:
      - caiman_backend
      - caiman_frontend
      - caiman_broker
    ports:
      - "80:80"
      - "443:443"

  caiman_wp_db:
    image: mariadb
    container_name: caiman_wp_db
    environment:
      MYSQL_ROOT_PASSWORD: 01Ul8TrH&Mq8
    volumes:
      - ./volumes/mariadb:/var/lib/mysql

  caiman_broker:
    restart: always
    image: caiman_broker:latest
    build: ./rabbitmq
    container_name: caiman_broker
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
    depends_on:
      - caiman_rabbitmq_auth
    ports:
      - 15672:15672
    healthcheck:
      interval: 2m

  caiman_phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: phpmyadmin
      depends_on:
        - caiman_wp_db
      environment:
          PMA_HOST: caiman_wp_db
          MYSQL_ROOT_PASSWORD: 01Ul8TrH&Mq8
          PMA_ABSOLUTE_URI: http://localhost/phpmyadmin/