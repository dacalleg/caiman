<div class="h-100 d-flex flex-column">
    <div class="header">
        <app-header></app-header>
    </div>
    <div class="container mt-5">
        <div class="row mb-5">
            <div class="col text-center">
                <div class="d-flex align-items-center justify-content-center">
                    <img src="assets/logo.svg" width="200px">
                    <div class="text-start">
                        <h1 class="fw-bold mb-0">CAIMAN</h1>
                        <small>By Micronova Srl</small>

                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="MAC Address"
                                        aria-label="MAC Address" aria-describedby="button-addon2"
                                        [(ngModel)]="macAddress">
                                    <button class="btn btn-outline-primary " type="button" id="button-addon2"
                                        (click)="connectUsingMAC()">Connect</button>
                                </div>
                            </div>
                        </div>
                        <div class="text-center my-3">
                            <span>OR</span>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control" placeholder="Serial Number"
                                        aria-label="Serial Number" aria-describedby="button-addon2">
                                    <button class="btn btn-outline-primary " type="button"
                                        id="button-addon2">Connect</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col">
                                <label for="macaddress" class="form-label">Mac Address</label>
                                <input type="text" class="form-control" placeholder="MAC Address"
                                    aria-label="MAC Address" aria-describedby="button-addon2" [(ngModel)]="macAddress"
                                    id="macaddress">
                            </div>
                            <div class="col">
                                <label for="productlist" class="form-label">Select a product</label>
                                <select id="productlist" class="form-select" [(ngModel)]="selectedProduct">
                                    <option selected [ngValue]="null">Select a product</option>
                                    <option *ngFor="let product of products$|async" [ngValue]="product.key"
                                        [innerHtml]="product.name"></option>
                                </select>
                            </div>
                        </div>
                        <div class="text-end">
                            <button class="btn btn-primary" (click)="connectUsingProduct()">Connect</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
