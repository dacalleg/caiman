<div class="dashboard-container">
    <div class="d-flex flex-grow-1 w-100 h-100">
        <div class="w-100 h-100 d-flex flex-column">
            <div class="header">
                <app-header (onBurgerClicked)="openMobileMenu()"></app-header>
            </div>

            <router-outlet></router-outlet>
        </div>
    </div>
    <div class="footer">
        <app-footer></app-footer>
        <div class="text-center" *ngIf="!(completed$|async)">
          <ng-container *ngIf="(sync$|async) as value">
            <ngb-progressbar type="success" class="sync" [value]="value * 100">Sincronizzazione in corso ... {{value|percent}}</ngb-progressbar>
          </ng-container>
        </div>
    </div>
</div>
