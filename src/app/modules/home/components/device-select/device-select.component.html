    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        <h2>Online Mode</h2>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="MAC Address" aria-label="MAC Address"
                            aria-describedby="button-addon2" [(ngModel)]="macAddress">
                        <button class="btn btn-outline-primary " type="button" id="button-addon2" (click)="connectUsingMAC()">Connect</button>
                    </div>
                    <div class="text-center my-3">
                        <span>OR</span>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Serial Number" aria-label="Serial Number"
                            aria-describedby="button-addon2">
                        <button class="btn btn-outline-primary " type="button" id="button-addon2">Connect</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        <h2>Offline Mode</h2>
                    </div>
                    <div class="d-flex align-items-end mb-3">
                        <div class="flex-grow-1">
                            <label for="productlist" class="form-label">Select a product</label>
                            <select id="productlist" class="form-select">
                                <option selected>Select a product</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                        </div>
                        <button class="btn btn-link">Refresh product list</button>
                    </div>
                    <div class="text-end">
                        <button class="btn btn-primary">Connect</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
