<div class="h-100 d-flex flex-column">
  <div class="header">
    <app-header></app-header>
  </div>
  <div class="container-fluid flex-grow-1" *ngIf="(loadDeviceData$|async) as device; else loader">

    <!--<div class="row">
          <div class="col-md-6">
            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Search variable by name or address..."
                aria-describedby="button-addon2" (keydown)="onSearchChange($event)">
              <button class="btn btn-primary" type="button" id="button-addon2">Search</button>
            </div>
          </div>
        </div>-->
    <div class="row align-items-start h-100">
      <div class="col-md-3 sticky-md-top">
        <div class="px-5 pt-5">
          <div class="row align-items-start">
            <div class="col">
              <ul class="nav nav-pills">
                <li class="nav-item back"><a class="nav-link" routerLink="/dashboard/home/">Torna indietro</a></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="d-flex" class="p-5 pt-2">
          <ul ngbNav #nav="ngbNav" class="nav-pills" orientation="vertical">
            <li ngbNavItem (shown)="unselectGroup()" [id]="0">
              <a ngbNavLink>Device Info</a>
              <ng-template ngbNavContent>
                <app-device-info [device]="device" [connected]="connected$|async"
                  (onDisconnect)="disconnect()"
                  (onBLEConnect)="bleConnect()"
                  (onBridgeConnect)="bridgeConnect()"
                  (onWifiConnect)="wifiConnect()"></app-device-info>
              </ng-template>
            </li>
            <li ngbNavItem (shown)="unselectGroup()" [id]="1">
              <a ngbNavLink>Timeline</a>
              <ng-template ngbNavContent>
                <app-tickets></app-tickets>
              </ng-template>
            </li>
            <li ngbNavItem (shown)="unselectGroup()" [id]="2">
              <a ngbNavLink>Advanced</a>
              <ng-template ngbNavContent>
                <div class="row align-items-start">
                  <div class="col-md text-center order-1 order-md-2 sticky-md-top">
                    <img [src]="device?.info?.image" class="w-100 image">
                  </div>
                  <div class="col order-2 order-md-1">
                    <h1 class="fw-bold">{{device?.mac}}</h1>
                    <div class="fw-bold">{{device?.name_product}}</div>

                    <div class="row my-5">
                      <div class="col-md">
                        <h3>DATABASE</h3>
                        <div class="input-group">
                          <select class="form-select" id="inputGroupSelect04"
                            aria-label="Example select with button addon" [(ngModel)]="databaseSelected">
                            <option selected disabled [value]="null">Choose...</option>
                            <option *ngFor="let db of device.info.database|withRole|async" [ngValue]="db">{{db.name}}</option>
                          </select>
                          <button class="btn btn-outline-secondary" type="button" (click)="loadDatabase()">Load</button>
                        </div>
                      </div>
                    </div>
                    <div class="row my-5">
                      <div class="col">
                        <h3>FIRMWARE GATEWAY</h3>
                        <div class="input-group">
                          <select class="form-select" id="inputGroupSelect04"
                            aria-label="Example select with button addon">
                            <option selected disabled [value]="null">Choose...</option>
                            <option *ngFor="let firmware of device.info.gateway_firmware_list|withRole|async" [ngValue]="firmware.file">{{firmware.revision}}</option>
                          </select>
                          <button class="btn btn-outline-secondary" type="button">Load</button>
                        </div>
                        <span>Current Revision: {{device.boards_status.Revision}}</span>
                      </div>
                    </div>
                    <div class="row my-5">
                      <div class="col">
                        <h3>FIRMWARE BOARD</h3>
                        <div class="input-group">
                          <select class="form-select" id="inputGroupSelect04"
                            aria-label="Example select with button addon">
                            <option selected disabled [value]="null">Choose...</option>
                            <option *ngFor="let firmware of device.info.board_firmware_list|withRole|async" [ngValue]="firmware.file">{{firmware.revision}}</option>
                          </select>
                          <button class="btn btn-outline-secondary" type="button">Load</button>
                        </div>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col">
                        <h3 class="mb-3">NETWORK</h3>
                        <ng-container  *ngIf="(wifiStatus$|async) as status">
                          <div class="text-end" *ngIf="!status.wifi_connected">
                            <button class="btn btn-outline-secondary me-2" type="button" (click)="disconnectWifi()">CANCELLA IMPOSTAZIONI WIFI</button>
                            <button class="btn btn-outline-secondary" type="button" (click)="scanWifi()">AGGIORNA</button>
                          </div>
                          <div class="pt-3">
                            <app-wifi-tease  *ngFor="let station of status.wifi_stations" [connected]="status.wifi_connected" [station]="station" (onDisconnect)="disconnectWifi()" (onConnect)="connectWifi($event)"></app-wifi-tease>
                          </div>
                        </ng-container>
                      </div>
                    </div>
                  </div>
                </div>
              </ng-template>
            </li>
            <ng-container *ngIf="connected$|async">
              <li ngbNavItem *ngFor="let group of groups$|async;let i = index" (shown)="onGroupSelected(group)" [id]="i + 3">
                <a ngbNavLink>{{group|overrideGroupName|async}}</a>
                <ng-template ngbNavContent>
                  <div class="row">
                    <div class="col my-2">
                      <h1 class="fw-bold">{{group}}</h1>
                    </div>
                  </div>
                  <div class="row align-items-stretch">
                    <ng-container *ngFor="let variable of variables$|async|varByGroup:group">
                      <div class="col-md-6 col-lg-4 col-xl-3 col-xxl-3 my-2">
                        <app-variable-tease [variable]="variable"></app-variable-tease>
                      </div>
                    </ng-container>
                  </div>
                </ng-template>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
      <div class="col p-3 p-md-5 content">
        <div [ngbNavOutlet]="nav" class="flex-grow-1"></div>
      </div>
    </div>
  </div>
  <ng-template #loader>
    <div class="d-flex h-100 w-100 justify-content-center align-items-center">
      <div class="text-center w-50 d-flex">
        <div class="container">
          <div class="row">
            <div class="col p-3">
              <div class="text-center mb-3">Loading...</div>
              <app-infinite-progress-bar></app-infinite-progress-bar>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</div>


<app-option-modal></app-option-modal>
<app-serial-modal></app-serial-modal>
<app-variable-edit></app-variable-edit>
<app-optimization></app-optimization>
