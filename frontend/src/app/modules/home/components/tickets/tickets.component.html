<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <h1>Tickets</h1>
            <div *ngFor="let ticket of tickets$|async" class="main-ticket p-3 d-flex" [ngClass]="ticket.status"
                (click)="selectTicket(ticket)">
                <div class="flex-grow-1">
                    <div>{{ticket.title}}</div>
                    <div class="description">{{ticket.text| slice : 0 : 50 }}...</div>
                </div>
                <div>
                    {{ticket.createdAt|date:'dd/MM/yy'}}
                </div>
            </div>
        </div>
        <div class="col response-container">
            <ng-container *ngIf="(selectedTicket$|async) as selectedTicket">
                <ng-template #recursiveList let-list>
                    <div class="response p-3" *ngFor="let response of list; let i = index">
                        <h4 *ngIf="response.title">{{response.title}}</h4>
                        <div>{{response.createdAt|date:'dd/MM/yy'}}</div>
                        <div>{{response.text}}</div>
                        <div *ngFor="let asset of response.assets; let i=index">
                            <a [href]="'https://caiman.micronovasrl.com/backend/wp-content/uploads/api/' + asset.path">Allegato {{i}}</a>
                        </div>
                        <div class="mt-3" *ngIf="visibleForm !== response.id">
                            <button class="btn btn-outline-primary" type="button" (click)="showForm(response.id)">Scrivi</button>
                        </div>

                        <div class="text-end mt-3">{{response.email}}</div>
                        <div *ngIf="visibleForm === response.id">
                            <div class="mb-3">
                                <label [for]="'message-' + i" class="form-label">Messaggio</label>
                                <textarea class="form-control" [id]="'message-' + i" [(ngModel)]="newTicket.text"></textarea>
                            </div>
                            <input #file type="file" (change)="onFileSelected($event)" class="d-none">
                            <div class="btn btn-outline-primary" (click)="addAsset()">Aggiungi allegato</div>
                            <button class="btn btn-outline-primary ms-2" type="button"(click)="sendMessaage(response)" >Rispondi</button>
                            <div class="my-3" *ngIf="attachments.length > 0">
                                <h3>Allegati</h3>
                                <div *ngFor="let file of attachments">
                                    {{file.name}}
                                </div>
                            </div>
                        </div>
                    </div>
                    <ng-container *ngFor="let response of list; let i = index">
                        <ng-container *ngTemplateOutlet="recursiveList; context:{ $implicit: response.children }"></ng-container>
                    </ng-container>
                </ng-template>
                <ng-container *ngTemplateOutlet="recursiveList; context:{ $implicit: [selectedTicket] }"></ng-container>
            </ng-container>
        </div>
    </div>
</div>
