<div class="dashboard-container">
    <div class="dashboard-body">
        <div class="header">
            <app-header (onBurgerClicked)="openMobileMenu()"></app-header>
        </div>
        <div class="dashboard-content">
            <router-outlet></router-outlet>
        </div>
    </div>
    <div class="footer">
        <app-footer></app-footer>
        <div class="sync-footer" *ngIf="!(completed$|async)">
          <ng-container *ngIf="(sync$|async) as value">
            <ngb-progressbar type="primary" class="sync sync-line" [value]="value * 100" [showValue]="false"></ngb-progressbar>
            <div class="sync-status">
              <span class="sync-status__label">
                <bi name="arrow-repeat"></bi>
                {{ 'sync.in_progress' | translate }}
              </span>
              <strong class="sync-status__percent">{{ value | percent }}</strong>
            </div>
          </ng-container>
        </div>
    </div>
</div>
