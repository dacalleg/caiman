  caiman_frontend:
    restart: always
    build: ./frontend
    image: caiman_frontend:latest
    container_name: caiman_frontend
    healthcheck:
      interval: 5m

  caiman_backend:
    restart: always
    build: ./backend
    image: caiman_backend:latest
    container_name: caiman_backend
    depends_on:
      - caiman_wp_db
    volumes:
      - ./volumes/uploads:/var/www/public/wp-content/uploads
      - ./volumes/backend/wp-config.php:/var/www/public/wp-config.php
    healthcheck:
      interval: 5m

  caiman_rabbitmq_auth:
    restart: always
    build: ./rabbimtmq-auth
    image: caiman_rabbitmq_auth:latest
    container_name: caiman_rabbitmq_auth
    command: ["node", "server.js"]
    healthcheck:
      interval: 5m
    environment:
      NODE_ENV: "production"

