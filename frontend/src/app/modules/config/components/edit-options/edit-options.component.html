<div class="row" *ngIf="variable">
    <div class="col">
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Add new option value:option name" [(ngModel)]="newOption">
            <button class="btn btn-outline-secondary" type="button" (click)="addOption()">Add</button>
          </div>
    </div>
    <div class="col">
        <span class="badge bg-secondary m-1" role="button" *ngFor="let opt of variable.values" (click)="removeOption(opt[0])">{{opt[0]}} -> {{opt[1]}}</span>
    </div>
</div>
