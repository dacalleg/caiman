<ng-container *ngIf="variable">
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Options</label>
      <textarea class="form-control" [ngModel]="list" (ngModelChange)="onListChange($event)" rows="5"></textarea>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col text-end">
      <button class="btn btn-primary" (click)="generateAllOptions()">Gen. ALL Options</button>
    </div>
  </div>
</ng-container>
