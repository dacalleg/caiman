version: '3.1'
services:

  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal
    restart: always
    environment:
       AUTOHEAL_CONTAINER_LABEL: all
       AUTOHEAL_INTERVAL: 30
    volumes:
       - /var/run/docker.sock:/var/run/docker.sock

  caiman_api:
    restart: always
    build: ./api
    image: caiman_api:latest
    container_name: caiman_api
    depends_on:
      - caiman_db
    volumes:
      - ./volumes/uploads/api:/usr/src/app/uploads
    command: ["node", "index.js"]
    healthcheck:
      interval: 5m
    environment:
      NODE_ENV: "production"
      DB_NAME: "api"
      DB_USER: "root"
      DB_PASSWORD: "01Ul8TrH&Mq8"
      DB_HOST: "caiman_db"
      JWT_AUTH_SECRET_KEY: "tokenagua"
      AVAILABLE_LANGUAGES: "it,en,fr"

  caiman_frontend:
    restart: always
    build: ./frontend
    image: caiman_frontend:latest
    container_name: caiman_frontend
    healthcheck:
      interval: 5m

  caiman_backend:
    restart: always
    build: ./backend
    image: caiman_backend:latest
    container_name: caiman_backend
    depends_on:
      - caiman_db
    volumes:
      - ./volumes/uploads:/var/www/public/wp-content/uploads
      - ./backend:/var/www/public
    healthcheck:
      interval: 5m
    environment:
      DB_NAME: "caiman"
      DB_USER: "root"
      DB_PASSWORD: "01Ul8TrH&Mq8"
      DB_HOST: "caiman_db"
      WP_DEBUG: "false"
      JWT_AUTH_SECRET_KEY: "tokenagua"
      JWT_AUTH_CORS_ENABLE: "true"
      AGUA_ID_BRAND: "1"
      AGUA_CUSTOMER_CODE: "132678"
      AGUA_HOSTNAME: "nordicfire.agua-iot.com"
      AGUA_ENDPOINT: "https://nordicfire.agua-iot.com"
      JWT_SOFTWARE_FIELD: "caiman"
      JWT_ID_FIELD: "464D7C31-0BBD-462D-A7F8-C03913EED030"
      JWT_ISS_FIELD: "caiman.micronovasrl.com"
      DEFAULT_ROLE: "service"
      DEFAULT_USER_ACCESS: "locked"
      DEFAULT_LANGUAGE_CODE: "it"
      DEFAULT_ADMIN_CODE: "it"

  caiman_rabbitmq_auth:
    restart: always
    build: ./rabbimtmq-auth
    image: caiman_rabbitmq_auth:latest
    container_name: caiman_rabbitmq_auth
    command: ["node", "server.js"]
    healthcheck:
      interval: 5m
    environment:
      NODE_ENV: "production"

  certbot:
    container_name: certbot
    image: gordonchan/auto-letsencrypt
    depends_on:
     - caiman_reverse_proxy
    volumes:
     - ./volumes/letsencrypt/log:/var/log/letsencrypt
     - /var/run/docker.sock:/var/run/docker.sock
     - ./volumes/letsencrypt/data:/etc/letsencrypt
     - ./volumes/letsencrypt/lib:/var/lib/letsencrypt
     - ./volumes/letsencrypt/www:/tmp/letsencrypt/www
     - ./volumes/letsencrypt/certs:/etc/nginx/certs
    environment:
     - EMAIL=info@micronovasrl.com
     - SERVER_CONTAINER=caiman_reverse_proxy
     - WEBROOT_PATH=/tmp/letsencrypt/www
     - CERTS_PATH=/etc/nginx/certs
     - DOMAINS=caimanweb-nordicfire.agua-iot.com
     - CHECK_FREQ=7
    restart: always

  caiman_reverse_proxy:
    restart: always
    build: ./reverse_proxy
    image: caiman_reverse_proxy:latest
    container_name: caiman_reverse_proxy
    volumes:
      - ./volumes/uploads:/data/uploads
      - ./volumes/letsencrypt/certs:/etc/nginx/certs
      - ./volumes/letsencrypt/www:/data/acme
    depends_on:
      - caiman_backend
      - caiman_frontend
      - caiman_broker
    ports:
      - "80:80"
      - "443:443"

  caiman_db:
    image: mariadb
    container_name: caiman_db
    environment:
      MYSQL_ROOT_PASSWORD: 01Ul8TrH&Mq8
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ./volumes/mariadb:/var/lib/mysql
    healthcheck:
      test: "/usr/local/bin/healthcheck.sh --connect"
      interval: 1m  
      timeout: 5s
      retries: 3
      start_period: 1m

  caiman_broker:
    hostname: rabbitmqbroker
    restart: always
    image: caiman_broker:latest
    build: ./rabbitmq
    container_name: caiman_broker
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
    depends_on:
      - caiman_rabbitmq_auth
    ports:
      - 15672:15672
    healthcheck:
      interval: 2m

  caiman_phpmyadmin:
      image: phpmyadmin/phpmyadmin
      restart: always
      container_name: phpmyadmin
      depends_on:
        - caiman_db
      environment:
          PMA_HOST: caiman_db
          MYSQL_ROOT_PASSWORD: 01Ul8TrH&Mq8
          PMA_ABSOLUTE_URI: https://caimanweb-nordicfire.agua-iot.com/phpmyadmin/
