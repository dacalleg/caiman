<div class="container-fluid">
    <div class="row">
        <div class="col-md vh-100">
            <div class="p-3"  style="width: 100%;height:100%" *ngIf="key$|async as key">
                <iframe [src]="('/print/operation/' + key) | safe" style="width: 100%;height:100%"></iframe>
            </div>
        </div>
        <div class="col-md vh-100 d-flex flex-column justify-content-end">
            <button class="btn btn-primary my-3">Conferma</button>
        </div>
    </div>
</div>
