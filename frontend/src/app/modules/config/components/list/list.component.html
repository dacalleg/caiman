<input #file type="file" (change)="onFileChange($event)" class="d-none">
<div class="container p-5">
    <div class="row">
        <div class="col text-end">
            <button class="btn btn-primary" (click)="importSnet2()">Importa nuova configurazione</button>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col">
            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Key</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let entry of list$|async">
                        <td>{{entry.name}}</td>
                        <td>{{entry.key}}</td>
                        <td class="text-end">
                            <button class="btn btn-primary" (click)="openConfig(entry.key!)">Modifica</button>
                            <button class="ms-2 btn btn-danger" (click)="deleteEntry(entry)">Elimina</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
